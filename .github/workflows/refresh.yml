name: refresh-cards

on:
  schedule:
    # 00:00, 06:00, 12:00 and 18:00 Hamburg time, following daylight saving.
    - cron: "0 0,6,12,18 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.toml"
      - "src/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the profile token
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -z "$PROFILE_TOKEN" ]; then
            echo "::error::Add a PROFILE_TOKEN secret (classic PAT, read:user). The default token cannot see private contributions and would publish lower numbers."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Test
        run: uv run --locked pytest

      - name: Fetch live data and render the cards
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: uv run --locked --no-dev profile-cards refresh

      - name: Commit the refreshed cards
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards
          if git diff --cached --quiet; then
            echo "Cards are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh profile cards"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # iquantum.co reads cards/site.json at build time; rebuild it when the data moved.
      - name: Rebuild iquantum.co
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.PORTFOLIO_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::PORTFOLIO_DEPLOY_HOOK is not set; iquantum.co keeps its last build."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_HOOK" > /dev/null
