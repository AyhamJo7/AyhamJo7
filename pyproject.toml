[project]
name = "profile-cards"
version = "0.1.0"
description = "Generates the animated SVG cards of the AyhamJo7 GitHub profile README from live GitHub data."
readme = "docs/DEVELOPING.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
profile-cards = "profile_cards.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "fonttools>=4.55",
    "brotli>=1.1",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profile_cards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "C4"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["fontTools", "fontTools.*"]
ignore_missing_imports = true
